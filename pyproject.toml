[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skysift"
version = "0.1.0"
description = "Archival time-series search and vetting engine for transit, eclipse and lensing candidates"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "numpy>=2.0", "scipy>=1.13", "astropy>=6.1", "pydantic>=2.7", "pydantic-settings>=2.3",
  "SQLAlchemy>=2.0", "typer>=0.12", "requests>=2.32", "truststore>=0.9", "PyYAML>=6.0", "rich>=13.7",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
pg = ["psycopg[binary]>=3.1"]
ui = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]
dossier = ["gaiadr3-zeropoint>=0.0.4"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.17,<0.18", "httpx>=0.27"]

[project.scripts]
skysift = "skysift.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"skysift.ui" = ["templates/*.html", "templates/partials/*.html", "static/*", "static/fonts/*"]
"skysift.data" = ["*.txt", "rnaas/*"]
"skysift" = ["templates/pack/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["golden: needs network to fetch cached fixtures", "slow: long running"]
addopts = "-m 'not slow'"
filterwarnings = [
  # Starlette 1.x nags that TestClient with httpx is deprecated in favour of httpx2; harmless for our tests
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
ignore = ["E701", "E702", "E731"]
