<!doctype html>
<html lang="en" data-mode="{{ mode }}" data-theme="{{ theme }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="{{ 'light dark' if theme == 'system' else theme }}">
<title>{% block title %}SkySift · {{ page_title }}{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css?v={{ git_commit }}">
<script src="/static/htmx.min.js?v={{ git_commit }}" defer></script>
{% if plotly_url %}<script src="{{ plotly_url }}?v={{ git_commit }}" defer></script>{% endif %}
<script src="/static/app.js?v={{ git_commit }}" defer></script>
{% block head %}{% endblock %}
</head>
<body hx-headers='{"X-SkySift-Token": "{{ token }}"}' data-token="{{ token }}">
<a class="skip" href="#main">Skip to content</a>
{% include "partials/topbar.html" %}
<main id="main" class="page">
{% block content %}{% endblock %}
</main>
<footer class="footer">
  <a href="/about">About</a>
  <span>SkySift {{ engine_version }}</span>
  <code>{{ git_commit }}</code>
</footer>
{% include "partials/bottomnav.html" %}
{% include "partials/toast.html" %}
<dialog id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
  <button type="button" class="dialog-close" data-dialog-close aria-label="Close">×</button>
  <div id="dialog-slot"></div>
</dialog>
</body>
</html>
